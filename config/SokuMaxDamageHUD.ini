[HUD]
; Panel preferences. AutoFit reserves room while preserving the 4:3 GAME
; client area. Only the first expanded layout may adjust the game window.
; Manual bottom selection also permits fitting. Other changes only move HUD.
Language=CN
Collapsed=0
Hidden=0
; Dock: 0=bottom, 1=left, 2=right. Dragging always selects one of these.
Dock=0
; Left/right docking use the portrait layout, matching the game height.
Vertical=0
AutoFit=1
; Preferred sidebar width in desktop coordinates; capped to available space.
SideWidth=240

[Damage]
; 1=ALLOW partial direct-frame fallback ONLY if no ranked skill in sourced
;    static data; it cannot inspect spawned projectiles or all possible hits.
; 0=default, safe source-based ranking (recommended).
EnableExperimentalFrameProbe=0

; Published Wiki maximum damage is loaded independently from WikiMaxProfiles.txt.
; Values with runtime buffs/current HP are estimated and marked ~.
