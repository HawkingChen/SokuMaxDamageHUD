name: Withdraw unverified v0.5.7 release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  withdraw-unverified:
    if: ${{ contains(github.event.head_commit.message, '[withdraw-v0.5.7]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove failed release and matching version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete v0.5.7 --repo "$GH_REPO" --yes --cleanup-tag
          if gh release view v0.5.7 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::v0.5.7 still exists after withdrawal"
            exit 1
          fi
          echo "v0.5.7 release withdrawn; do not publish again without user acceptance."
